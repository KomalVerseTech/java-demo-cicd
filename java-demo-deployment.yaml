apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-demo-cicd

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-demo-cicd

  template:
    metadata:
      labels:
        app: java-demo-cicd

    spec:
      containers:
        - name: java-demo
          image: 581245317342.dkr.ecr.ap-south-1.amazonaws.com/java-demo-ecr:v1

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
